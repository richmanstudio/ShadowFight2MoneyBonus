name: Publish v1.1.0 beta (Windows GUI)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1-1-beta.yml'

permissions:
  contents: write

jobs:
  tests:
    name: Test - ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile CLI and GUI
        run: python -m py_compile sf2save.py gui.py
      - name: Import GUI and check both translations
        if: runner.os == 'Windows'
        run: python -c "import gui; assert set(gui.STRINGS['ru']) == set(gui.STRINGS['en']); print('GUI import and translations OK')"

  windows:
    name: Build beta Windows executable
    needs: [tests]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install packager
        run: python -m pip install --upgrade pyinstaller
      - name: Package
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name SF2-Save-Editor-Windows gui.py
      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/SF2-Save-Editor-Windows.exe")) {
            throw "Windows EXE missing"
          }
          Get-Item "dist/SF2-Save-Editor-Windows.exe" | Select-Object Name,Length
          Get-FileHash "dist/SF2-Save-Editor-Windows.exe" -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: sf2-beta-windows-gui
          path: dist/SF2-Save-Editor-Windows.exe
          if-no-files-found: error

  release:
    name: Publish prerelease
    needs: [tests, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sf2-beta-windows-gui
          path: release-bin
      - name: Create v1.1.0-beta.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.1.0-beta.1 >/dev/null 2>&1; then
            echo "Pre-release already exists: refusing to overwrite."
            exit 1
          fi
          test -s release-bin/SF2-Save-Editor-Windows.exe
          gh release create v1.1.0-beta.1 release-bin/SF2-Save-Editor-Windows.exe \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "ShadowFight2MoneyBonus v1.1.0-beta.1 — Orbs & Energy" \
            --notes-file RELEASE_NOTES_v1.1.0-beta.1.md \
            --prerelease
