name: Publish v1.0.0 (Windows GUI)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.yml'

permissions:
  contents: write

jobs:
  tests:
    name: Tests - ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile editor and GUI
        run: python -m py_compile sf2save.py gui.py
      - name: Import the Windows GUI and validate translations
        if: runner.os == 'Windows'
        run: python -c "import gui; assert set(gui.STRINGS['ru']) == set(gui.STRINGS['en']); print('GUI imports and translations verified')"

  build_windows:
    name: Package Windows executable
    needs: [tests]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Package standalone GUI
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name SF2-Save-Editor-Windows gui.py
      - name: Check packaged file
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/SF2-Save-Editor-Windows.exe")) {
            throw "Windows executable not found"
          }
          Get-Item "dist/SF2-Save-Editor-Windows.exe" | Select-Object Name,Length
          Get-FileHash "dist/SF2-Save-Editor-Windows.exe" -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: sf2-windows-gui
          path: dist/SF2-Save-Editor-Windows.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release v1.0.0
    needs: [tests, build_windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sf2-windows-gui
          path: release-bin
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "Release v1.0.0 already exists; refusing to overwrite it."
            exit 1
          fi
          test -s release-bin/SF2-Save-Editor-Windows.exe
          gh release create v1.0.0 release-bin/SF2-Save-Editor-Windows.exe \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "ShadowFight2MoneyBonus v1.0.0" \
            --notes-file RELEASE_NOTES.md \
            --latest
